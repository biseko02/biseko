<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Routes</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f4f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        h2 {
            color: #003366;
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>View Routes</h2>

        <label for="region">Select Region:</label>
        <select id="region" name="region">
            <option value="">Select Region</option>
        </select>

        <label for="district">Select District:</label>
        <select id="district" name="district">
            <option value="">Select District</option>
        </select>

        <div id="map"></div>
    </div>

    <script>
        let map;
        let marker;
        let locations = {
            "Dar es Salaam": { lat: -6.7924, lng: 39.2083 },
            "Arusha": { lat: -3.3869, lng: 36.6820 },
            "Mwanza": { lat: -2.5164, lng: 32.9170 },
            "Dodoma": { lat: -6.1630, lng: 35.7516 }
        };

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -6.7924, lng: 39.2083 }, // Default to Dar es Salaam
                zoom: 7
            });

            marker = new google.maps.Marker({
                position: { lat: -6.7924, lng: 39.2083 },
                map: map,
                title: "Selected Route"
            });
        }

        $(document).ready(function () {
            // Load Regions and Districts from JSON
            $.getJSON("tanzania_routes.json", function (data) {
                let regionDropdown = $("#region");
                let districtDropdown = $("#district");

                // Populate regions
                $.each(data, function (region, districts) {
                    regionDropdown.append(`<option value="${region}">${region}</option>`);
                });

                // Update districts when region is selected
                regionDropdown.change(function () {
                    let selectedRegion = $(this).val();
                    districtDropdown.empty().append(`<option value="">Select District</option>`);

                    if (data[selectedRegion]) {
                        $.each(data[selectedRegion], function (district, price) {
                            districtDropdown.append(`<option value="${district}">${district}</option>`);
                        });
                    }

                    // Move the map to selected region
                    if (locations[selectedRegion]) {
                        let position = locations[selectedRegion];
                        map.setCenter(position);
                        marker.setPosition(position);
                    }
                });

                // Update map when district is selected
                districtDropdown.change(function () {
                    let selectedRegion = $("#region").val();
                    let selectedDistrict = $(this).val();

                    if (locations[selectedRegion]) {
                        let position = locations[selectedRegion];
                        map.setCenter(position);
                        marker.setPosition(position);
                        marker.setTitle(selectedDistrict);
                    }
                });
            });
        });
    </script>

</body>
</html>
